<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="t">
  <title id="t">homebridge-unifi-network-stats</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3F6FA"/>
    </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#006FFF" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- App tile -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <rect x="17" y="17" width="478" height="478" rx="107" fill="none" stroke="#D5DCE6" stroke-width="2"/>

  <g filter="url(#shadow)" fill="none" stroke="#006FFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Links from gateway to clients -->
    <path d="M256 250 V300 M256 300 H148 V338 M256 300 V338 M256 300 H364 V338" stroke-width="18"/>

    <!-- Gateway -->
    <rect x="150" y="162" width="212" height="88" rx="26" stroke-width="18"/>

    <!-- Download / upload arrows inside the gateway -->
    <path d="M214 184 V228 M198 212 L214 228 L230 212" stroke-width="14"/>
    <path d="M298 228 V184 M282 200 L298 184 L314 200" stroke-width="14"/>

    <!-- Client nodes -->
    <circle cx="148" cy="364" r="28" fill="#006FFF" stroke="none"/>
    <circle cx="256" cy="364" r="28" fill="#006FFF" stroke="none"/>
    <circle cx="364" cy="364" r="28" fill="#006FFF" stroke="none"/>

    <!-- WAN uplink -->
    <path d="M256 162 V118" stroke-width="18"/>
    <circle cx="256" cy="104" r="16" fill="#006FFF" stroke="none"/>
  </g>
</svg>
